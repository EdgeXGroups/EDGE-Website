[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"


[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Vite fingerprints everything in /assets — cache it forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product images and logos change rarely, but aren't fingerprinted.
[[headers]]
  for = "/designs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URLs: /collection, /team, /contact
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
