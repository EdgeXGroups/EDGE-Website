[build]
  command = "npm run build && node scripts/sourcemaps.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /api/create-order, /api/verify-payment, /api/razorpay-webhook (each function sets its own path)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


[[headers]]
  for = "/checkout*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/account*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Vite fingerprints everything in /assets — cache it forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product images and logos change rarely, but aren't fingerprinted.
[[headers]]
  for = "/designs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only these places may supply scripts, styles, images, connections and frames.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://*.razorpay.com https://eu-assets.i.posthog.com https://eu.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://eu.posthog.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://vpjntbsednknihxgntje.supabase.co https://*.razorpay.com https://eu.posthog.com https://eu-assets.i.posthog.com; connect-src 'self' https://vpjntbsednknihxgntje.supabase.co wss://vpjntbsednknihxgntje.supabase.co https://*.razorpay.com https://eu.i.posthog.com https://eu-assets.i.posthog.com https://eu.posthog.com; frame-src https://*.razorpay.com https://eu.posthog.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.razorpay.com; frame-ancestors 'self' https://eu.posthog.com; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\")"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# One address for the shop: anything still served at the old edgewebsite.netlify.app
# (an older copy that builds from this repo) is forwarded to the real site.
[[redirects]]
  from = "https://edgewebsite.netlify.app/*"
  to = "https://edgexgroup.netlify.app/:splat"
  status = 301
  force = true

# PostHog through our own domain (ad blockers block posthog.com). EU cloud.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# Pretty URLs: /collection, /team, /contact
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/refunds"
  to = "/refunds.html"
  status = 200

[[redirects]]
  from = "/shipping"
  to = "/shipping.html"
  status = 200
