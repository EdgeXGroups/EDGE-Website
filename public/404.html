<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070707" />
  <title>Lost — EDGE</title>
  <link rel="icon" href="/brand/edge-mark.png" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Instrument+Serif:ital@1&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #070707; --bone: #edeae3; --accent: #ff4a1c; --mute: #8b8880; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 20px;
      padding: 16px; text-align: center; background: var(--ink); color: var(--bone); font-family: 'Archivo', sans-serif;
    }
    img { width: 56px; }
    h1 { font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(64px, 20vw, 220px); line-height: 0.85; letter-spacing: -0.03em; }
    em { font-family: 'Instrument Serif', serif; font-weight: 400; color: var(--accent); font-size: clamp(26px, 7vw, 48px); }
    a { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); background: var(--bone); padding: 16px 26px; border-radius: 99px; text-decoration: none; margin-top: 12px; }
    a:hover { background: var(--accent); }
  </style>
</head>
<body>
  <img src="/brand/edge-mark.png" alt="EDGE" />
  <h1>404</h1>
  <em>You went past the edge.</em>
  <a href="/">Back to the drop</a>
</body>
</html>
