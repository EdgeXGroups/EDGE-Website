<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070707" />
  <title>Collection — EDGE</title>
  <meta name="description" content="Every EDGE design and the story behind it." />
  <meta property="og:title" content="EDGE — The Collection" />
  <meta property="og:description" content="Every design, every story." />
  <meta property="og:image" content="/brand/edge-wordmark.png" />
  <link rel="icon" href="/brand/edge-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="page-archive" data-page="collection">
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

  <main id="top" class="archive">
    <section class="archive__head">
      <p class="mono eyebrow">The collection</p>
      <h1 class="display archive__title"><span>Every</span> <em class="serif">design</em><sup class="mono">(<span data-count="designs"></span>)</sup></h1>
      <p class="archive__intro">Every piece we’ve made, and the story behind each one. Tap any design to read it.</p>
    </section>

    <div class="archive__bar">
      <div class="chips" role="group" aria-label="Filter by category"></div>
      <div class="views" role="group" aria-label="Layout">
        <button class="views__btn is-on" data-view="grid" aria-pressed="true">Grid</button>
        <button class="views__btn" data-view="list" aria-pressed="false">Index</button>
      </div>
    </div>

    <section class="archive__grid" data-view="grid"></section>
    <div class="archive__float" aria-hidden="true"><img alt="" /></div>

    <a class="archive__cta" href="/contact.html" data-cursor="Say hi">
      <span class="mono eyebrow">Seen something you like?</span>
      <span class="display">Ask us <em class="serif">about it</em> →</span>
    </a>
  </main>


  <script type="module" src="/src/collection.js"></script>
</body>
</html>
