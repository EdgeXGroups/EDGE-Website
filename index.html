<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070707" />
  <title>EDGE — Drop 01</title>
  <meta name="description" content="EDGE is a clothing & merch label. Every piece starts as a story. Drop 01 is live." />
  <meta property="og:title" content="EDGE — Drop 01" />
  <meta property="og:description" content="Every piece starts as a story. Drop 01 is live." />
  <meta property="og:image" content="/brand/edge-wordmark.png" />
  <link rel="icon" href="/brand/edge-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="is-loading" data-page="home">
  <!-- ░░ Preloader ░░ -->
  <div class="loader" aria-hidden="true">
    <div class="loader__panel loader__panel--top"></div>
    <div class="loader__panel loader__panel--bottom"></div>
    <div class="loader__inner">
      <div class="loader__mark">
        <img src="/brand/edge-g.png" alt="" class="loader__g loader__g--ghost" />
        <img src="/brand/edge-g.png" alt="" class="loader__g loader__g--fill" />
      </div>
      <div class="loader__meta">
        <span>EDGE / DROP 01</span>
        <span class="loader__count">000</span>
      </div>
    </div>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

  <main id="top">
    <!-- ░░ Hero ░░ -->
    <section class="hero">
      <canvas class="hero__gl"></canvas>
      <img class="hero__fallback" src="/brand/edge-wordmark.png" alt="" />
      <h1 class="sr-only">EDGE — clothing and merch</h1>
      <div class="hero__bottom">
        <div class="hero__left">
          <p class="hero__lede serif" data-brand="tagline"></p>
          <a href="/collection.html" class="btn hero__shop" data-magnetic><span>View the collection →</span></a>
        </div>
        <a href="#drop" class="hero__cta" data-magnetic data-cursor="Scroll">
          <span class="hero__cta-ring"><svg viewBox="0 0 100 100"><defs><path id="c" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs><text><textPath href="#c" textLength="238" lengthAdjust="spacing">SEE THE DROP · SEE THE DROP · </textPath></text></svg></span>
          <span class="hero__cta-arrow">↓</span>
        </a>
      </div>
    </section>

    <!-- ░░ Tapes ░░ -->
    <section class="tapes" aria-hidden="true">
      <div class="tape tape--a"><div class="tape__track"></div></div>
      <div class="tape tape--b"><div class="tape__track"></div></div>
    </section>

    <!-- ░░ Spotlight — newest piece, revealed by light ░░ -->
    <section class="spot" id="drop" aria-label="Drop 01: the featured designs">
      <canvas class="spot__gl"></canvas>
      <div class="spot__intro">
        <p class="mono eyebrow">Now showing</p>
        <h2 class="display drop__title"><span class="line-mask"><span>Drop</span></span><span class="line-mask"><em class="serif">01</em></span></h2>
        <p class="mono spot__hint">Keep scrolling ↓</p>
      </div>
      <div class="spot__stage"></div>
      <div class="spot__controls">
        <button class="spot__arrow spot__prev" aria-label="Previous design" data-magnetic>←</button>
        <span class="mono spot__turn">Drag or scroll to turn ↻</span>
        <button class="spot__arrow spot__next" aria-label="Next design" data-magnetic>→</button>
      </div>
      <div class="spot__caption">
        <p class="mono spot__num"></p>
        <h2 class="display spot__name"></h2>
        <p class="serif spot__tag"></p>
        <div class="spot__buy">
          <p class="spot__price"></p>
          <a class="btn spot__cta" data-magnetic><span>Read the story</span></a>
        </div>
      </div>
    </section>

    <!-- ░░ The rest of the collection ░░ -->
    <section class="more"></section>

    <!-- ░░ What makes Edge different ░░ -->
    <section class="different" id="different">
      <div class="manifesto">
        <p class="manifesto__text"></p>
      </div>
      <ol class="pillars"></ol>
    </section>

  </main>


  <script type="module" src="/src/main.js"></script>
</body>
</html>
